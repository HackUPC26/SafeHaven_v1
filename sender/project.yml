# SafeHaven v1 — Sender
#
# XcodeGen spec. Generate the Xcode project with:
#
#     brew install xcodegen
#     xcodegen generate
#     open SafeHaven.xcodeproj
#
# No third-party dependencies. Everything is Apple-platform native:
# AVFoundation / VideoToolbox (capture + H.264), SoundAnalysis (on-device ML),
# CoreLocation (GPS), Security + CryptoKit (token/key generation + the deferred
# encryption seam), Network/URLSession (relay WebSocket).
#
# A physical device is REQUIRED to exercise camera + SoundAnalysis (the
# simulator has no camera and SNClassifySoundRequest is unavailable there).

name: SafeHaven
options:
  bundleIdPrefix: com.fochs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    # iOS 17 minimum — Neural Engine SoundAnalysis + modern SwiftUI.
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""              # set your team for on-device runs
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO       # we ship our own Info.plist

targets:
  SafeHaven:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Disguise
      - path: Settings
      - path: Session
      - path: Capture
      - path: AI
      - path: Transport
      - path: Persistence
      - path: Config
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fochs.safehaven
        PRODUCT_NAME: SafeHaven
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SafeHaven.entitlements
        # Disguise stays a light, normal-looking weather app.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    # System frameworks. All present on iOS 17; no SPM/CocoaPods needed.
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: SoundAnalysis.framework
      - sdk: CoreLocation.framework
      - sdk: Security.framework
      - sdk: CryptoKit.framework      # reserved for the deferred encryption seam
      - sdk: Network.framework
